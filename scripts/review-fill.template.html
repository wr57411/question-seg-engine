<!doctype html><html lang="zh"><meta charset="utf-8"><title>补字候选判定</title>
<style>
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#5a6470;margin-bottom:10px}
.pill{background:#fff;border:1px solid #d7dde5;border-radius:999px;padding:4px 10px}
.card{background:#fff;border:1px solid #d7dde5;border-radius:12px;padding:14px}
img{width:100%;border-radius:8px;border:1px solid #e1e6ec;background:#fff}
.txt{margin-top:10px;font-size:14px;line-height:1.6;word-break:break-all}
.k{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;margin-right:6px}
.kn{background:#eaf5ff;color:#1d6fd0}.ko{background:#fff4e0;color:#8a5300}
.mono{font-family:ui-monospace,Menlo,monospace;background:#f7f9fb;border:1px solid #e6e9ee;border-radius:6px;padding:6px 8px;display:block;margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;padding:11px 8px;border-radius:9px;border:1px solid #cfd6df;background:#fff;cursor:pointer}
button:hover{background:#f2f6fb}
button.p{background:#1d6fd0;color:#fff;border-color:#1d6fd0}
button.p:hover{background:#185db0}
button.g{background:#f2f5f8}
.note{font-size:12px;color:#5a6470;margin-top:10px}
.big{font-size:26px;font-weight:700}
.done{background:#e9f7ee;border-left:4px solid #2fa15c;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px;max-height:220px;overflow:auto}
</style>
<div class="wrap">
  <div class="bar"><div>补字候选判定 · <b>《__DOC__》</b> · 红框=洞（上游漏读的位置）</div><div class="pill" id="prog">1 / N</div></div>
  <div class="card" id="card"></div>
  <div class="btns" id="btns"></div>
  <div class="btns" style="grid-template-columns:repeat(2,1fr);margin-top:8px">
    <button class="g" onclick="vote('skip')">跳过 (0)</button>
    <button class="g" onclick="finish()">导出结果</button>
  </div>
  <div class="note">键盘：1 新对 · 2 旧对 · 3 都错 · 4 都对 · 5 不该补 · 0 跳过 · ← 上一条。判定存在本机，刷新不丢。</div>
  <div id="out"></div>
</div>
<script>
const CASES = __CASES__;
const KEY = "fill-review-" + CASES.length;
let votes = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = 0;
function renderButtons(c){
  const el = document.getElementById("btns");
  el.innerHTML = c.old
    ? '<button class="p" onclick="vote(\'new\')">① 新对</button><button onclick="vote(\'old\')">② 旧对</button><button onclick="vote(\'both_wrong\')">③ 都错</button><button onclick="vote(\'both_ok\')">④ 都对</button><button onclick="vote(\'no_fill\')" style="grid-column:span 4;background:#fff8f7;border-color:#e3b4ae;color:#b42318">⑤ 这个洞根本不该补</button>'
    : '<button class="p" onclick="vote(\'new\')">① 新对</button><button onclick="vote(\'new_wrong\')">② 新错</button><button onclick="vote(\'no_fill\')" style="background:#fff8f7;border-color:#e3b4ae;color:#b42318">③ 不该补</button><button onclick="vote(\'skip\')">跳过</button>';
}
function render(){
  renderButtons(CASES[i]);
  const c = CASES[i];
  document.getElementById("prog").textContent = (i+1) + " / " + CASES.length;
  document.getElementById("card").innerHTML =
    '<div class="note">第 ' + c.page + ' 页 · 来源 ' + c.kind + '</div>' +
    '<img src="data:image/jpeg;base64,' + c.img + '">' +
    '<div class="txt"><span class="k kn">新路径</span><span class="mono">' + esc(c.new) + '</span></div>' +
    (c.old ? '<div class="txt"><span class="k ko">现状产线</span><span class="mono">' + esc(c.old) + '</span></div>' : '') +
    '<div class="note">洞尺寸约 ' + c.w + '×' + c.h + ' px（页面像素）；红带=洞，四周多留了上下文便于定位</div>' +
    (votes[c.id] ? '<div class="done">已判：' + zh(votes[c.id]) + '（再点一次可改）</div>' : '');
}
function esc(s){return (s||"").replace(/[&<>]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function zh(v){return {new:"新对",old:"旧对",both_wrong:"都错",both_ok:"都对",no_fill:"不该补",new_wrong:"新错",skip:"跳过"}[v]||v}
function vote(v){
  votes[CASES[i].id] = v;
  localStorage.setItem(KEY, JSON.stringify(votes));
  if (i < CASES.length-1) { i++; render(); } else { render(); finish(); }
}
function finish(){
  const rows = CASES.map(c => ({page:c.page, kind:c.kind, verdict: votes[c.id]||"unjudged", new:c.new, old:c.old}));
  const summary = {};
  rows.forEach(r => summary[r.verdict] = (summary[r.verdict]||0)+1);
  const payload = JSON.stringify({doc:"__DOC__", judgedAt:new Date().toISOString(), summary, rows}, null, 1);
  document.getElementById("out").innerHTML = '<div class="note">全选后复制，或点下面按钮下载。</div><pre id="json">' + esc(payload) + '</pre>' +
    '<div class="btns" style="grid-template-columns:repeat(2,1fr)"><button class="p" onclick="copyJson()">复制结果</button>' +
    '<button class="g" onclick="dl()">下载 JSON</button></div>';
  window.__payload = payload;
}
function copyJson(){ navigator.clipboard.writeText(window.__payload).then(()=>alert("已复制，粘给我即可")); }
function dl(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([window.__payload], {type:"application/json"}));
  a.download = "fill-review.json"; a.click();
}
document.addEventListener("keydown", e => {
  if (e.key === "1") vote("new");
  else if (e.key === "2") vote("old");
  else if (e.key === "3") vote("both_wrong");
  else if (e.key === "4") vote("both_ok");
  else if (e.key === "5") vote("no_fill");
  else if (e.key === "2" && !CASES[i].old) vote("new_wrong");
  else if (e.key === "0") vote("skip");
  else if (e.key === "ArrowLeft" && i>0) { i--; render(); }
});
render();
</script>
</html>
