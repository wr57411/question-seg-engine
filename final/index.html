<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成品 · 原版保真</title>
  <!-- 复用阶段页的纸面样式（.canvas / .blk / .q-chip 等）——成品与对比右侧是同一件东西，
       样式也必须同源，否则「一样」就只是口号。 -->
  <link rel="stylesheet" href="../stages/stages.css" />
  <link rel="stylesheet" href="./final.css" />
</head>
<body>
  <header class="fb-bar">
    <div class="fb-left">
      <strong>成品</strong>
      <span class="fb-sub">按原坐标重建 · 非原图</span>
    </div>
    <div class="fb-mid">
      <select id="doc-pick" aria-label="选择文档"></select>
      <input
        id="jump"
        type="search"
        autocomplete="off"
        placeholder="题号 / 页码 / 搜索"
        aria-label="跳转到题号、页码，或搜索正文"
      />
      <span class="fb-page" id="page-now">—</span>
    </div>
    <div class="fb-right">
      <button class="fb-pick" id="t-pick" type="button" aria-pressed="false"
        title="打开后点题目任意位置，把这道题归入专题/类别">挑题</button>
      <button class="fb-more" id="t-more" type="button" aria-expanded="false"
        aria-controls="more-menu" aria-label="更多显示与链接">⋯</button>
      <div class="fb-menu" id="more-menu" hidden>
        <span class="fb-health" id="doc-health" hidden></span>
        <label class="fb-toggle" title="解析遗漏（洋红框）与丢弃块（灰虚线）——原版书上没有这些标记，默认不显示">
          <input type="checkbox" id="t-audit" /> 审计标记
        </label>
        <label class="fb-toggle" title="OCR 补回的行加青绿候选样式；关掉则按普通正文显示（信息仍在悬停里）">
          <input type="checkbox" id="t-ocr" checked /> OCR 候选样式
        </label>
        <a id="lnk-stages" href="#" target="_blank" rel="noopener">分阶段 ↗</a>
        <a id="lnk-viewer" href="#" target="_blank" rel="noopener">阅读版 ↗</a>
      </div>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div class="hits" id="hits" hidden aria-label="搜索结果"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="pick-undo" id="pick-undo" hidden>
    <span id="pick-undo-text"></span>
    <button id="pick-undo-btn" type="button">撤销</button>
  </div>
  <main id="book" aria-label="重建纸面"></main>

  <section class="pick-tray" id="pick-tray" hidden aria-label="挑题托盘">
    <div class="pick-head">
      <span class="pick-title" id="pick-title">未选题</span>
      <button class="pick-same" id="pick-same" type="button" disabled>同上题</button>
      <button class="pick-close" id="pick-close" type="button">收起</button>
    </div>
    <div class="pick-lanes" id="pick-rows" hidden>
      <div class="pick-lane">
        <span class="pick-lane-label">专题</span>
        <div class="pick-chips" id="pick-topics" role="group" aria-label="专题"></div>
        <button class="pick-add" id="pick-add-topics" type="button" aria-label="新建专题">＋</button>
      </div>
      <div class="pick-lane">
        <span class="pick-lane-label">类别</span>
        <div class="pick-chips" id="pick-categories" role="group" aria-label="类别"></div>
        <button class="pick-add" id="pick-add-categories" type="button" aria-label="新建类别">＋</button>
      </div>
    </div>
    <form class="pick-create" id="pick-create" hidden>
      <input class="pick-create-input" id="pick-create-name" type="text" maxlength="60"
        autocomplete="off" placeholder="新名字" aria-label="新专题或类别名称" />
      <button class="pick-create-ok" id="pick-create-ok" type="submit">建好并打上</button>
      <button class="pick-create-cancel" id="pick-create-cancel" type="button">取消</button>
    </form>
    <p class="pick-hint" id="pick-hint">先点一道题</p>
  </section>

  <aside class="fb-detail" id="detail" hidden aria-label="题目详情"></aside>

  <script type="module" src="./final.js"></script>
</body>
</html>
